name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Runs everyday at 00:00 UTC (adjust time/frequency as desired)
    - cron: '0 0 * * *'
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: "src"
          fetch-depth: 0

      - name: Update Constants
        id: update_constants
        run: |
          cd $GITHUB_WORKSPACE/src
          node Anoboy/update-constants.js
          node Moviebox/update-constants.js
          
          # Check if any constants were modified
          if [ -n "$(git status --porcelain Anoboy Moviebox)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add Anoboy Moviebox
            git commit -m "Auto-update provider constants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No source changes detected"
          fi

      - name: Checkout builds
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        uses: actions/checkout@v7
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm $GITHUB_WORKSPACE/builds/*.jar || true

      - name: Setup JDK 17
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          ./gradlew ensureJarCompatibility
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp **/build/*.jar $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds || true

      - name: Push builds
        if: github.event_name != 'schedule' || steps.update_constants.outputs.has_changes == 'true'
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
